name: Build Electron App

# main에 push할 때마다 돌지 않고, v로 시작하는 태그를 push하거나
# Actions 탭에서 수동 실행(Run workflow)할 때만 빌드한다.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: windows
          - os: macos-latest
            artifact-name: macos
          - os: ubuntu-latest
            artifact-name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: pnpm electron:build

      - name: Upload artifacts (CI, requires GitHub login to download)
        uses: actions/upload-artifact@v4
        with:
          name: huri-pizza-${{ matrix.artifact-name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: ignore

      # v로 시작하는 태그를 push하면(예: v0.1.0), 다른 사람도 로그인 없이
      # 받을 수 있는 공개 GitHub Release에 실행 파일을 자동으로 첨부한다.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
